{% extends "base.html" %}
{% block title %}{{ page_title }} · Ink & Ideas{% endblock %}
{% block content %}
<div class="editor-wrap"><p class="eyebrow">YOUR NEXT STORY</p><h1>{{ page_title }}</h1><p class="muted">Don't worry about perfect. Just start writing.</p>
<form class="form-card editor" method="post"><label>Title</label><input name="title" required maxlength="180" value="{{ post.title if post else '' }}" placeholder="Give your story a title"><label>Your story</label><textarea name="content" rows="12" required placeholder="What would you like to share?">{{ post.content if post else '' }}</textarea><div class="form-actions"><a class="text-link" href="{{ url_for('index') }}">Cancel</a><button class="button" type="submit">Publish story ↗</button></div></form></div>
{% endblock %}
